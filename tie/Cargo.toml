[package]
name = "tie"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0 OR MIT"
description = "TIE core service: validation gateway, ground-truth registry, verifier adapters, and kaizen logging"
default-run = "tie"
publish = false

# Single-binary foundation for Phase 0/1.
# We keep the seams modular in src/ and will expand to a workspace once the
# internal crates are split out in subsequent phases.

[features]
default = ["http", "swagger-ui"]
http = []
grpc = ["dep:tonic", "dep:tonic-web", "dep:prost"]
creusot = ["dep:creusot-contracts"]
swagger-ui = ["dep:utoipa", "dep:utoipa-swagger-ui"]
bundled-z3 = ["z3/bundled"]

[dependencies]
# HTTP / API surface
actix-web = "4.13.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
utoipa = { version = "5.4.0", optional = true }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"], optional = true }

# Async runtime / transport
chrono = { version = "0.4.44", features = ["serde"] }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "fs", "process"] }
tonic = { version = "0.14.5", optional = true }
tonic-web = { version = "0.14.5", optional = true }
prost = { version = "0.14.3", optional = true }

# Ground Truth Registry
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros", "migrate", "uuid", "chrono", "json"] }
ed25519-dalek = "2.2.0"
sha2 = "0.11.0"
secrecy = "0.10.3"
uuid = { version = "1.23.0", features = ["serde", "v7"] }
moka = { version = "0.12.15", features = ["future"] }
toml = "1.1.2"

# Verifier adapters
z3 = { version = "0.20.0", default-features = false }
creusot-contracts = { version = "0.8.0", optional = true }

# Kaizen logger / telemetry / diagnostics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = "0.32.1"
opentelemetry = "0.31.0"
opentelemetry_sdk = "0.31.0"

# Error handling / CLI / ergonomics
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "env"] }
thiserror = "2.0.18"
seahash = "4.1.0"

[build-dependencies]
# Added now so the gRPC surface can be switched on without reworking the build.
tonic-build = "0.14.5"


[profile.dev]
debug = 1
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dev-dependencies]
criterion = "0.5.1"

[package.metadata.tie]
deployment_model = "single-tenant-first"
multi_tenant_ready = true
registry_backend = "sqlite"
signature_scheme = "ed25519"
verification_policy = "deployment-configurable"

[[bench]]
name = "cache_key_bench"
harness = false
